version: "3.8"

services:
  # ─── FastAPI Backend ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar-api
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results:ro
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Streamlit Dashboard ──────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results:ro
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    depends_on:
      - api
